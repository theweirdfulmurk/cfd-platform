---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfd-platform-backend
  namespace: cfd-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cfd-platform-backend
  template:
    metadata:
      labels:
        app: cfd-platform-backend
    spec:
      serviceAccountName: cfd-platform-backend
      containers:
        - name: backend
          image: ghcr.io/theweirdfulmurk/cfd-platform-backend:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: K8S_NAMESPACE
              value: cfd-platform
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: configs
              mountPath: /pvc
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {cpu: 1,    memory: 512Mi}
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: simulation-configs
---
apiVersion: v1
kind: Service
metadata:
  name: cfd-platform-backend
  namespace: cfd-platform
spec:
  selector:
    app: cfd-platform-backend
  ports:
    - port: 80
      targetPort: 8080
